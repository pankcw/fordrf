<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cherry // the skit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============ RESET & TOKENS ============ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root{
    --bg:#080808;
    --panel:#0b0b0b;
    --head:#0e0e0e;
    --line:#1a1a1a;
    --line-2:#242424;
    --neon:#00ff9d;
    --neon-soft:rgba(0,255,157,.14);
    --red:#ff4d5e;
    --txt:#e9efec;
    --muted:#5b6663;
    --dim:#39413e;
    --mono:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }

  html, body{ height:100%; }

  body{
    background:var(--bg);
    color:var(--txt);
    font-family:var(--mono);
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:26px 16px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ BACKGROUND FX ============ */
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(0,255,157,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,157,.05) 1px, transparent 1px);
    background-size:42px 42px;
    -webkit-mask-image:radial-gradient(circle at 50% 38%, #000 0%, transparent 72%);
    mask-image:radial-gradient(circle at 50% 38%, #000 0%, transparent 72%);
  }
  body::after{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.32) 0 1px, transparent 1px 3px);
    opacity:.28;
  }

  /* ============ TERMINAL SHELL ============ */
  .wrap{
    width:100%;
    max-width:1060px;
    position:relative;
    z-index:1;
  }

  .term{
    background:linear-gradient(180deg,#0d0d0d,#090909);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(0,0,0,.9),
      0 40px 90px -40px rgba(0,255,157,.18),
      0 20px 60px -20px rgba(0,0,0,.9);
  }

  /* ---- title bar ---- */
  .term-bar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 14px;
    background:linear-gradient(180deg,#121212,#0c0c0c);
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .dots{ display:flex; gap:7px; }
  .dots span{
    width:10px; height:10px; border-radius:50%;
    display:block;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);
  }
  .dots span:nth-child(1){ background:#ff4d5e; }
  .dots span:nth-child(2){ background:#ffd166; }
  .dots span:nth-child(3){ background:#00ff9d; }

  .prompt{
    color:var(--neon);
    font-size:12.5px;
    letter-spacing:.02em;
    white-space:nowrap;
  }
  .prompt .path{ color:#8ff5c8; }

  .cursor{
    display:inline-block;
    width:8px; height:15px;
    margin-left:5px;
    vertical-align:-3px;
    background:var(--neon);
    box-shadow:0 0 10px var(--neon);
    animation:blink 1.05s steps(1) infinite;
  }
  .cursor.small{ height:12px; width:7px; vertical-align:-2px; }
  @keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }

  .bar-right{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .status{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:10px;
    letter-spacing:.16em;
    color:var(--neon);
  }
  .status .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--neon);
    box-shadow:0 0 10px var(--neon);
    animation:pulse 1.9s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%    { opacity:.35; transform:scale(.72); }
  }
  .status.err{ color:var(--red); }
  .status.err .dot{ background:var(--red); box-shadow:0 0 10px var(--red); }

  .clock{
    font-size:11px;
    letter-spacing:.12em;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  /* ---- body / grid ---- */
  .term-body{ padding:16px; background:#0a0a0a; }

  .grid{
    display:grid;
    grid-template-columns:350px 1fr;
    gap:16px;
    align-items:stretch;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:11px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  .panel-head{
    display:flex;
    align-items:center;
    gap:9px;
    padding:9px 12px;
    background:var(--head);
    border-bottom:1px solid var(--line);
    font-size:11px;
  }
  .tag{ color:var(--neon); letter-spacing:.1em; }
  .file{ color:var(--muted); letter-spacing:.04em; }

  .chip{
    margin-left:auto;
    font:inherit;
    font-size:9.5px;
    letter-spacing:.16em;
    color:var(--muted);
    background:transparent;
    border:1px solid var(--line-2);
    border-radius:99px;
    padding:4px 11px;
    cursor:pointer;
    transition:color .2s, border-color .2s, background .2s, box-shadow .2s;
  }
  .chip:hover{ color:var(--neon); border-color:var(--neon); }
  .chip.on{
    color:#04120c;
    background:var(--neon);
    border-color:var(--neon);
    box-shadow:0 0 20px -5px var(--neon);
  }

  /* ============ PLAYER ============ */
  .player{ padding:14px; }

  .cover{
    position:relative;
    width:100%;
    max-width:330px;
    margin:0 auto;
    aspect-ratio:1/1;
    border-radius:10px;
    overflow:hidden;
    border:1px solid #1f1f1f;
    display:grid;
    place-items:center;
    background:
      radial-gradient(circle at 28% 22%, rgba(255,77,94,.42), transparent 56%),
      radial-gradient(circle at 76% 82%, rgba(0,255,157,.24), transparent 60%),
      radial-gradient(circle at 50% 50%, #101010, #060606 78%);
  }
  .cover::before{
    content:"";
    position:absolute;
    width:76%;
    aspect-ratio:1/1;
    border-radius:50%;
    border:1px dashed rgba(0,255,157,.28);
    animation:spin 22s linear infinite;
  }
  body:not(.playing) .cover::before{ animation-play-state:paused; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .cover-art{ position:relative; z-index:2; text-align:center; }
  .cover-title{
    font-size:clamp(19px,4.4vw,28px);
    font-weight:700;
    letter-spacing:.42em;
    padding-left:.42em;
    color:#fff;
    text-shadow:0 0 26px rgba(255,77,94,.6), 0 0 60px rgba(255,77,94,.25);
  }
  .cover-sub{
    margin-top:9px;
    font-size:9.5px;
    letter-spacing:.52em;
    padding-left:.52em;
    color:var(--neon);
    opacity:.85;
  }

  .viz{
    position:absolute;
    left:0; right:0; bottom:0;
    height:54px;
    display:flex;
    align-items:flex-end;
    gap:2px;
    padding:0 10px 10px;
    z-index:3;
    pointer-events:none;
  }
  .viz span{
    flex:1 1 0;
    min-height:2px;
    height:4%;
    border-radius:2px;
    background:linear-gradient(180deg, var(--neon), rgba(0,255,157,.12));
    box-shadow:0 0 6px rgba(0,255,157,.35);
  }

  .meta{ margin-top:16px; text-align:center; }
  .meta h1{
    font-size:17px;
    font-weight:600;
    letter-spacing:.06em;
    color:#fff;
  }
  .meta p{
    margin-top:4px;
    font-size:10.5px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* ---- progress ---- */
  .progress{
    position:relative;
    height:20px;
    margin-top:16px;
    display:flex;
    align-items:center;
    cursor:pointer;
    touch-action:none;
  }
  .progress-track{
    position:absolute;
    left:0; right:0;
    top:50%;
    transform:translateY(-50%);
    height:4px;
    border-radius:99px;
    background:#1b1b1b;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    border-radius:99px;
    background:linear-gradient(90deg,#00ff9d,#8bffd0);
    box-shadow:0 0 14px rgba(0,255,157,.65);
  }
  .progress-handle{
    position:absolute;
    top:50%;
    left:0%;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--neon);
    box-shadow:0 0 12px var(--neon);
    transform:translate(-50%,-50%);
    opacity:0;
    transition:opacity .2s;
    pointer-events:none;
  }
  .progress:hover .progress-handle,
  .progress:active .progress-handle{ opacity:1; }

  .times{
    display:flex;
    justify-content:space-between;
    margin-top:6px;
    font-size:10.5px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    letter-spacing:.06em;
  }

  /* ---- controls ---- */
  .controls{
    display:flex;
    align-items:center;
    gap:11px;
    margin-top:14px;
  }

  .btn{
    display:grid;
    place-items:center;
    background:transparent;
    border:1px solid var(--line-2);
    border-radius:9px;
    color:var(--txt);
    cursor:pointer;
    transition:color .2s, border-color .2s, box-shadow .2s, background .2s, transform .15s;
    flex:0 0 auto;
  }
  .btn:hover{ color:var(--neon); border-color:var(--neon); box-shadow:0 0 22px -8px var(--neon); }
  .btn:active{ transform:scale(.94); }
  .btn svg{ width:17px; height:17px; fill:currentColor; }

  .btn-sm{ width:34px; height:34px; }

  .btn-play{
    width:48px; height:48px;
    border-radius:50%;
    border-color:var(--neon);
    color:var(--neon);
    background:rgba(0,255,157,.07);
    box-shadow:0 0 28px -10px var(--neon);
  }
  .btn-play:hover{ background:rgba(0,255,157,.16); }
  .btn-play svg{ width:20px; height:20px; }

  #playBtn .ic-pause{ display:none; }
  body.playing #playBtn .ic-play{ display:none; }
  body.playing #playBtn .ic-pause{ display:block; }

  #muteBtn .ic-mute{ display:none; }
  #muteBtn.is-muted .ic-vol{ display:none; }
  #muteBtn.is-muted .ic-mute{ display:block; }

  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    flex:1 1 auto;
    min-width:60px;
    height:4px;
    border-radius:99px;
    outline:none;
    cursor:pointer;
    background:linear-gradient(90deg, var(--neon) 0%, var(--neon) var(--fill,80%), #1e1e1e var(--fill,80%));
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px; height:12px;
    border-radius:50%;
    border:none;
    background:var(--neon);
    box-shadow:0 0 12px var(--neon);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:12px; height:12px;
    border:none;
    border-radius:50%;
    background:var(--neon);
    box-shadow:0 0 12px var(--neon);
    cursor:pointer;
  }

  /* ============ LYRICS ============ */
  .lyrics{ min-height:0; }

  .lyrics-view{
    position:relative;
    flex:1 1 auto;
    min-height:280px;
    overflow-y:auto;
    overflow-x:hidden;
    scrollbar-width:thin;
    scrollbar-color:#202020 transparent;
    -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 13%, #000 87%, transparent 100%);
    mask-image:linear-gradient(180deg, transparent 0, #000 13%, #000 87%, transparent 100%);
  }
  .lyrics-view::-webkit-scrollbar{ width:6px; }
  .lyrics-view::-webkit-scrollbar-thumb{ background:#1f1f1f; border-radius:99px; }
  .lyrics-view::-webkit-scrollbar-track{ background:transparent; }

  .lyrics-list{
    position:relative;
    padding:36px 0 56px;
  }

  .line{
    position:relative;
    padding:9px 20px;
    font-size:14.5px;
    line-height:1.55;
    color:#7d8a86;
    opacity:.34;
    cursor:pointer;
    transition:color .35s ease, opacity .35s ease, transform .45s cubic-bezier(.22,1,.36,1), text-shadow .35s ease;
    will-change:transform, opacity;
  }
  .line:hover{ opacity:.7; color:#b9c6c1; }
  .line.past{ opacity:.24; }
  .line.active{
    color:var(--neon);
    opacity:1;
    transform:scale(1.025);
    font-weight:600;
    text-shadow:0 0 20px rgba(0,255,157,.45);
  }
  .line::after{
    content:"";
    position:absolute;
    left:20px; right:20px; bottom:3px;
    height:1px;
    background:var(--neon);
    opacity:0;
    transform:scaleX(var(--p,0));
    transform-origin:left center;
    transition:opacity .3s ease;
    box-shadow:0 0 8px var(--neon);
  }
  .line.active::after{ opacity:.55; }

  /* karaoke mode */
  body.karaoke .line{
    font-size:21px;
    padding:13px 26px;
    line-height:1.45;
    letter-spacing:.01em;
  }
  body.karaoke .line.active{ transform:scale(1.03); }
  body.karaoke .line::after{ left:26px; right:26px; }

  .panel-foot{
    padding:8px 12px;
    border-top:1px solid var(--line);
    background:#0d0d0d;
    font-size:10px;
    letter-spacing:.04em;
    color:var(--dim);
  }

  /* ---- term foot ---- */
  .term-foot{
    display:flex;
    align-items:center;
    gap:6px;
    padding:9px 16px;
    border-top:1px solid var(--line);
    background:#0c0c0c;
    font-size:11px;
    color:var(--muted);
    min-height:36px;
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width:880px){
    .grid{ grid-template-columns:1fr; }
    .cover{ max-width:290px; }
    .lyrics-view{ min-height:300px; max-height:52vh; }
    body.karaoke .line{ font-size:18px; padding:11px 20px; }
  }

  @media (max-width:520px){
    body{ padding:14px 10px; font-size:13px; }
    .term-bar{ gap:10px; padding:9px 11px; }
    .prompt{ font-size:11px; }
    .clock{ font-size:10px; }
    .status{ font-size:9px; letter-spacing:.12em; }
    .term-body{ padding:11px; }
    .player{ padding:12px; }
    .line{ font-size:13.5px; padding:8px 15px; }
    .line::after{ left:15px; right:15px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

<!-- ===== AUDIO SOURCE (ganti file di assets/cherry.mp3) ===== -->
<audio id="audio" src="assets/cherry.mp3" preload="metadata"></audio>

<div class="wrap">
  <main class="term">

    <!-- ================= HEADER / TITLE BAR ================= -->
    <header class="term-bar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="prompt">user@cherry:<span class="path">~</span>$<span class="cursor"></span></div>
      <div class="bar-right">
        <div class="status" id="status">
          <i class="dot"></i><span id="statusText">SYSTEM ONLINE</span>
        </div>
        <div class="clock" id="clock">--:--:--</div>
      </div>
    </header>

    <!-- ================= BODY ================= -->
    <div class="term-body">
      <div class="grid">

        <!-- ---------- MUSIC PLAYER ---------- -->
        <section class="panel player" aria-label="Music player">
          <div class="panel-head">
            <span class="tag">player</span>
            <span class="file">cherry.mp3</span>
          </div>

          <div class="cover">
            <div class="cover-art">
              <div class="cover-title">CHERRY</div>
              <div class="cover-sub">THE SKIT</div>
            </div>
            <div class="viz" id="viz" aria-hidden="true"></div>
          </div>

          <div class="meta">
            <h1>Cherry</h1>
            <p>The Skit</p>
          </div>

          <!-- progress -->
          <div class="progress" id="progress" role="slider"
               aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-handle" id="progressHandle"></div>
          </div>
          <div class="times">
            <span id="curTime">00:00</span>
            <span id="durTime">--:--</span>
          </div>

          <!-- controls -->
          <div class="controls">
            <button class="btn btn-sm" id="restartBtn" title="Restart" aria-label="Restart">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
            </button>

            <button class="btn btn-play" id="playBtn" title="Play / Pause" aria-label="Play atau Pause">
              <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
            </button>

            <button class="btn btn-sm" id="muteBtn" title="Mute" aria-label="Mute">
              <svg class="ic-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              <svg class="ic-mute" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25a7 7 0 0 1-2.25 1.18v2.06a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73 12 10.73 4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
            </button>

            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.85" aria-label="Volume">
          </div>
        </section>

        <!-- ---------- LYRICS ---------- -->
        <section class="panel lyrics" aria-label="Lirik tersinkronisasi">
          <div class="panel-head">
            <span class="tag">lyrics</span>
            <span class="file">cherry.txt</span>
            <button class="chip" id="karaokeBtn">KARAOKE</button>
          </div>

          <div class="lyrics-view" id="lyricsView">
            <div class="lyrics-list" id="lyricsList"></div>
          </div>

          <div class="panel-foot">// sync: audio.currentTime &middot; event: timeupdate</div>
        </section>

      </div>
    </div>

    <!-- ================= FOOTER ================= -->
    <div class="term-foot">
      <span id="typed"></span><span class="cursor small"></span>
    </div>

  </main>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     1. ELEMENT REFS
     ========================================================= */
  const $ = (id) => document.getElementById(id);

  const audio          = $('audio');
  const playBtn        = $('playBtn');
  const restartBtn     = $('restartBtn');
  const muteBtn        = $('muteBtn');
  const volumeEl       = $('volume');
  const progress       = $('progress');
  const progressFill   = $('progressFill');
  const progressHandle = $('progressHandle');
  const curTimeEl      = $('curTime');
  const durTimeEl      = $('durTime');
  const lyricsView     = $('lyricsView');
  const lyricsList     = $('lyricsList');
  const karaokeBtn     = $('karaokeBtn');
  const viz            = $('viz');
  const statusEl       = $('status');
  const statusText     = $('statusText');
  const clockEl        = $('clock');
  const typedEl        = $('typed');

  /* =========================================================
     2. DATA LIRIK
     ---------------------------------------------------------
     ⚠️  PENTING:
     Teks lirik asli "Cherry" – The Skit TIDAK disertakan di sini
     karena dilindungi hak cipta. Di bawah ini hanya PLACEHOLDER.

     Cara mengisi:
       1. Buka file ini dengan editor.
       2. Ganti setiap objek pada array `lyrics` di bawah.
       3. `time`  = detik saat baris MULAI dinyanyikan (angka).
       4. `text`  = potongan baris lirik.
       5. Urutkan dari waktu kecil ke besar.

     Highlight baris aktif memakai timestamp terakhir yang sudah
     tercapai (currentTime >= time), jadi sinkronisasi tetap benar
     saat pause, resume, maupun seek.
     ========================================================= */
  const lyrics = [
    { time: 0.0,   text: "♪ intro ♪" },
    { time: 12.0,  text: "[ verse 1 ] — baris lirik 1 (placeholder)" },
    { time: 16.0,  text: "[ verse 1 ] — baris lirik 2 (placeholder)" },
    { time: 20.0,  text: "[ verse 1 ] — baris lirik 3 (placeholder)" },
    { time: 24.0,  text: "[ verse 1 ] — baris lirik 4 (placeholder)" },
    { time: 28.5,  text: "[ pre-chorus ] — baris lirik 5 (placeholder)" },
    { time: 32.0,  text: "[ pre-chorus ] — baris lirik 6 (placeholder)" },
    { time: 36.0,  text: "♪ chorus ♪" },
    { time: 39.5,  text: "[ chorus ] — baris lirik 7 (placeholder)" },
    { time: 43.0,  text: "[ chorus ] — baris lirik 8 (placeholder)" },
    { time: 47.0,  text: "[ chorus ] — baris lirik 9 (placeholder)" },
    { time: 51.0,  text: "[ chorus ] — baris lirik 10 (placeholder)" },
    { time: 56.0,  text: "♪ interlude ♪" },
    { time: 62.0,  text: "[ verse 2 ] — baris lirik 11 (placeholder)" },
    { time: 66.0,  text: "[ verse 2 ] — baris lirik 12 (placeholder)" },
    { time: 70.0,  text: "[ verse 2 ] — baris lirik 13 (placeholder)" },
    { time: 75.0,  text: "[ bridge ] — baris lirik 14 (placeholder)" },
    { time: 80.0,  text: "[ bridge ] — baris lirik 15 (placeholder)" },
    { time: 85.0,  text: "♪ outro ♪" }
  ];

  /* =========================================================
     3. CLOCK (real-time)
     ========================================================= */
  function tickClock() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    clockEl.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* =========================================================
     4. TYPEWRITER FOOTER
     ========================================================= */
  const TYPED = '// letakkan file audio di assets/cherry.mp3 → tekan play → lirik tersinkron otomatis';
  let typeIdx = 0;
  (function typeNext() {
    if (typeIdx <= TYPED.length) {
      typedEl.textContent = TYPED.slice(0, typeIdx++);
      setTimeout(typeNext, 30);
    }
  })();

  /* =========================================================
     5. STATUS HELPER
     ========================================================= */
  function setStatus(text, isError) {
    statusText.textContent = text;
    statusEl.classList.toggle('err', !!isError);
  }

  /* =========================================================
     6. VISUALIZER
     ========================================================= */
  const BAR_COUNT = 42;
  const bars = [];
  const barLevels = new Array(BAR_COUNT).fill(0);

  for (let i = 0; i < BAR_COUNT; i++) {
    const s = document.createElement('span');
    viz.appendChild(s);
    bars.push(s);
  }

  let audioCtx = null;
  let analyser = null;
  let freqData = null;
  let audioCtxFailed = false;

  function ensureAudioCtx() {
    if (audioCtx || audioCtxFailed) return;

    // Web Audio pada protokol file:// sering diblokir CORS di Chrome
    // dan bisa membuat audio jadi senyap. Jadi kita pakai fallback.
    if (location.protocol === 'file:') {
      audioCtxFailed = true;
      return;
    }

    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { audioCtxFailed = true; return; }

      audioCtx = new AC();
      const src = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.78;

      src.connect(analyser);
      analyser.connect(audioCtx.destination);

      freqData = new Uint8Array(analyser.frequencyBinCount);
    } catch (e) {
      audioCtx = null;
      analyser = null;
      audioCtxFailed = true;
    }
  }

  function drawVisualizer() {
    const paused = audio.paused;

    if (analyser && !paused) {
      analyser.getByteFrequencyData(freqData);
    }

    const now = performance.now() / 720;

    for (let i = 0; i < BAR_COUNT; i++) {
      let target = 0.03;

      if (!paused) {
        if (analyser && freqData) {
          // distribusi frekuensi non-linear biar lebih "hidup"
          const idx = Math.floor(Math.pow(i / BAR_COUNT, 1.35) * (freqData.length * 0.78));
          target = 0.05 + (freqData[idx] / 255) * 0.95;
        } else {
          // fallback prosedural (bukan data audio, hanya dekorasi)
          const v = Math.abs(Math.sin(now + i * 0.42)) * 0.6 +
                    Math.abs(Math.sin(now * 1.7 + i * 0.91)) * 0.4;
          target = Math.max(0.08, Math.min(1, 0.14 + v * 0.78));
        }
      }

      barLevels[i] += (target - barLevels[i]) * 0.26;
      bars[i].style.height = (barLevels[i] * 100).toFixed(1) + '%';
    }
  }

  /* =========================================================
     7. BUILD LYRICS DOM
     ========================================================= */
  const lineEls = [];

  lyrics.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'line';
    el.textContent = item.text;
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.title = 'Klik untuk lompat ke ' + formatTime(item.time);

    const jump = () => {
      if (!isFinite(audio.duration) || audio.duration <= 0) return;
      audio.currentTime = Math.min(item.time, audio.duration - 0.05);
      syncLyrics();
      updateProgressUI();
      if (audio.paused) togglePlay();
    };

    el.addEventListener('click', jump);
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); jump(); }
    });

    lyricsList.appendChild(el);
    lineEls.push(el);
  });

  /* =========================================================
     8. TIME FORMAT
     ========================================================= */
  function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  /* =========================================================
     9. LYRIC SYNC ENGINE
     ---------------------------------------------------------
     Baris aktif = index terakhir yang `time`-nya sudah tercapai.
     Tidak memakai timer animasi → tetap akurat saat seek/pause.
     ========================================================= */
  let activeIndex = -1;

  function findActiveIndex(t) {
    let idx = -1;
    for (let i = 0; i < lyrics.length; i++) {
      if (t >= lyrics[i].time) idx = i;
      else break;
    }
    return idx;
  }

  function scrollToLine(el) {
    const target = el.offsetTop - (lyricsView.clientHeight / 2) + (el.offsetHeight / 2);
    lyricsView.scrollTo({
      top: Math.max(0, target),
      behavior: 'smooth'
    });
  }

  function syncLyrics() {
    if (!lineEls.length) return;

    const t = audio.currentTime;
    const idx = findActiveIndex(t);

    if (idx !== activeIndex) {
      activeIndex = idx;

      for (let i = 0; i < lineEls.length; i++) {
        const el = lineEls[i];
        el.classList.toggle('active', i === idx);
        el.classList.toggle('past', i < idx);
        if (i !== idx) el.style.setProperty('--p', '0');
      }

      if (idx >= 0) scrollToLine(lineEls[idx]);
    }

    // progress baris aktif (untuk garis glow di bawah lirik)
    if (idx >= 0) {
      const start = lyrics[idx].time;
      const end = (idx + 1 < lyrics.length)
        ? lyrics[idx + 1].time
        : Math.max(isFinite(audio.duration) ? audio.duration : start + 4, start + 4);

      const span = Math.max(0.2, end - start);
      const p = Math.min(1, Math.max(0, (t - start) / span));
      lineEls[idx].style.setProperty('--p', p.toFixed(3));
    }
  }

  /* =========================================================
     10. PROGRESS BAR + SEEK
     ========================================================= */
  let dragging = false;

  function updateProgressUI() {
    const d = isFinite(audio.duration) ? audio.duration : 0;
    const t = audio.currentTime || 0;
    const pct = d > 0 ? (t / d) * 100 : 0;

    progressFill.style.width = pct.toFixed(2) + '%';
    progressHandle.style.left = pct.toFixed(2) + '%';
    curTimeEl.textContent = formatTime(t);

    progress.setAttribute('aria-valuenow', Math.round(pct));
  }

  function seekFromClientX(clientX) {
    const rect = progress.getBoundingClientRect();
    if (rect.width <= 0) return;

    const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));

    if (isFinite(audio.duration) && audio.duration > 0) {
      audio.currentTime = ratio * audio.duration;
      updateProgressUI();
      syncLyrics();
    }
  }

  progress.addEventListener('pointerdown', (e) => {
    dragging = true;
    try { progress.setPointerCapture(e.pointerId); } catch (_) {}
    seekFromClientX(e.clientX);
  });

  progress.addEventListener('pointermove', (e) => {
    if (dragging) seekFromClientX(e.clientX);
  });

  const endDrag = (e) => {
    if (!dragging) return;
    dragging = false;
    try { progress.releasePointerCapture(e.pointerId); } catch (_) {}
  };
  progress.addEventListener('pointerup', endDrag);
  progress.addEventListener('pointercancel', endDrag);

  progress.addEventListener('keydown', (e) => {
    if (!isFinite(audio.duration)) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - 5); }
  });

  /* =========================================================
     11. PLAYER CONTROLS
     ========================================================= */
  function togglePlay() {
    if (audio.paused) {
      ensureAudioCtx();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      const p = audio.play();
      if (p && typeof p.catch === 'function') {
        p.catch(() => {
          setStatus('AUDIO NOT FOUND', true);
        });
      }
    } else {
      audio.pause();
    }
  }

  playBtn.addEventListener('click', togglePlay);

  restartBtn.addEventListener('click', () => {
    audio.currentTime = 0;
    activeIndex = -1;
    syncLyrics();
    updateProgressUI();
    lyricsView.scrollTo({ top: 0, behavior: 'smooth' });
    if (audio.paused) togglePlay();
  });

  /* =========================================================
     12. VOLUME
     ========================================================= */
  function paintRange(el) {
    const min = parseFloat(el.min) || 0;
    const max = parseFloat(el.max) || 1;
    const val = parseFloat(el.value);
    const pct = ((val - min) / (max - min)) * 100;
    el.style.setProperty('--fill', pct + '%');
  }

  function updateMuteUI() {
    const muted = audio.muted || audio.volume === 0;
    muteBtn.classList.toggle('is-muted', muted);
  }

  audio.volume = parseFloat(volumeEl.value);
  paintRange(volumeEl);

  volumeEl.addEventListener('input', () => {
    audio.volume = parseFloat(volumeEl.value);
    audio.muted = audio.volume === 0;
    paintRange(volumeEl);
    updateMuteUI();
  });

  muteBtn.addEventListener('click', () => {
    audio.muted = !audio.muted;
    updateMuteUI();
  });

  /* =========================================================
     13. AUDIO EVENTS
     ========================================================= */
  audio.addEventListener('loadedmetadata', () => {
    durTimeEl.textContent = formatTime(audio.duration);
    setStatus('SYSTEM ONLINE', false);
    updateProgressUI();
    syncLyrics();
  });

  audio.addEventListener('durationchange', () => {
    durTimeEl.textContent = formatTime(audio.duration);
  });

  audio.addEventListener('play', () => {
    document.body.classList.add('playing');
    setStatus('SYSTEM PLAYING', false);
  });

  audio.addEventListener('pause', () => {
    document.body.classList.remove('playing');
    setStatus('SYSTEM ONLINE', false);
  });

  audio.addEventListener('ended', () => {
    document.body.classList.remove('playing');
    setStatus('SYSTEM ONLINE', false);
  });

  audio.addEventListener('error', () => {
    document.body.classList.remove('playing');
    setStatus('AUDIO NOT FOUND', true);
    durTimeEl.textContent = '--:--';
  });

  // inti sinkronisasi: setiap kali waktu audio berubah
  audio.addEventListener('timeupdate', () => {
    updateProgressUI();
    syncLyrics();
  });

  audio.addEventListener('seeking', () => {
    updateProgressUI();
    syncLyrics();
  });

  audio.addEventListener('seeked', () => {
    updateProgressUI();
    syncLyrics();
  });

  /* =========================================================
     14. KARAOKE MODE
     ========================================================= */
  karaokeBtn.addEventListener('click', () => {
    const on = document.body.classList.toggle('karaoke');
    karaokeBtn.classList.toggle('on', on);
    karaokeBtn.textContent = on ? 'NORMAL' : 'KARAOKE';

    // re-center baris aktif setelah ukuran berubah
    if (activeIndex >= 0) {
      requestAnimationFrame(() => scrollToLine(lineEls[activeIndex]));
    }
  });

  /* =========================================================
     15. KEYBOARD SHORTCUTS
     ========================================================= */
  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'button') return;

    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.key === 'ArrowRight' && isFinite(audio.duration)) {
      e.preventDefault();
      audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      audio.currentTime = Math.max(0, audio.currentTime - 5);
    }
  });

  /* =========================================================
     16. MAIN LOOP (smooth progress + visualizer + lirik)
     ========================================================= */
  function frame() {
    updateProgressUI();
    syncLyrics();
    drawVisualizer();
    requestAnimationFrame(frame);
  }

  // state awal
  updateProgressUI();
  updateMuteUI();
  syncLyrics();
  requestAnimationFrame(frame);

  // kalau metadata sudah ter-cache sebelum listener terpasang
  if (audio.readyState >= 1) {
    durTimeEl.textContent = formatTime(audio.duration);
  }

})();
</script>
</body>
</html>
